name: Incident Service CI

on:
  push:
    branches: [ "actions" ]

  pull_request:
    branches: [ "actions" ]

jobs:
  ci-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Unit Tests
        working-directory: services/incident-service
        run: mvn clean test

      - name: Verify Multi-Stage Docker Build
        working-directory: services/incident-service
        run: docker build -t incident-service:${{ github.sha }} .